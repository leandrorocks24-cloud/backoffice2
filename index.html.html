<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Backoffice - Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F7F7F5; /* Notion-like off-white background */
            color: #37352F;
        }
        
        /* Custom scrollbar for columns */
        .kanban-column::-webkit-scrollbar {
            width: 6px;
        }
        .kanban-column::-webkit-scrollbar-track {
            background: transparent;
        }
        .kanban-column::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 10px;
        }

        .kanban-card {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .kanban-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .kanban-card.dragging {
            opacity: 0.5;
            background-color: #f3f4f6;
        }

        /* Notion-style inputs */
        .notion-input {
            border: 1px solid #E1E1E1;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            width: 100%;
            transition: border-color 0.2s;
            background-color: #ffffff;
        }
        .notion-input:focus {
            outline: none;
            border-color: #2eaadc;
            box-shadow: 0 0 0 1px rgba(46, 170, 220, 0.2);
        }

        .notion-btn-primary {
            background-color: #2eaadc;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .notion-btn-primary:hover {
            background-color: #2196c3;
        }

        .modal-overlay {
            background-color: rgba(15, 15, 15, 0.6);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            <h1 class="text-xl font-semibold text-gray-800">Painel Backoffice Central</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="sync-status" class="text-sm text-gray-500 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-yellow-400 inline-block animate-pulse"></span> Conectando...
            </span>
            <button onclick="openModal()" class="notion-btn-primary flex items-center gap-1">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nova Demanda
            </button>
        </div>
    </header>

    <!-- Kanban Board -->
    <main class="flex-1 p-6 overflow-x-auto flex items-start gap-6 min-w-min">
        
        <!-- Coluna: Demandas Ativas -->
        <div class="flex-1 min-w-[300px] max-w-sm flex flex-col h-full">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-gray-400"></span> Demandas Ativas
                </h2>
                <span id="count-ativas" class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full">0</span>
            </div>
            <div id="col-ativas" class="kanban-column bg-gray-50/50 rounded-lg p-2 h-full overflow-y-auto border border-gray-100 flex flex-col gap-2" ondragover="allowDrop(event)" ondrop="drop(event, 'ativas')">
                <!-- Cards serão renderizados aqui -->
            </div>
        </div>

        <!-- Coluna: Em Processo -->
        <div class="flex-1 min-w-[300px] max-w-sm flex flex-col h-full">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> Em Processo
                </h2>
                <span id="count-processo" class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full">0</span>
            </div>
            <div id="col-processo" class="kanban-column bg-blue-50/30 rounded-lg p-2 h-full overflow-y-auto border border-gray-100 flex flex-col gap-2" ondragover="allowDrop(event)" ondrop="drop(event, 'processo')">
                <!-- Cards serão renderizados aqui -->
            </div>
        </div>

        <!-- Coluna: Finalizadas -->
        <div class="flex-1 min-w-[300px] max-w-sm flex flex-col h-full">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span> Finalizadas
                </h2>
                <span id="count-finalizadas" class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full">0</span>
            </div>
            <div id="col-finalizadas" class="kanban-column bg-green-50/30 rounded-lg p-2 h-full overflow-y-auto border border-gray-100 flex flex-col gap-2" ondragover="allowDrop(event)" ondrop="drop(event, 'finalizadas')">
                <!-- Cards serão renderizados aqui -->
            </div>
        </div>

    </main>

    <!-- Modal Adicionar/Editar Demanda -->
    <div id="demandModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold" id="modalTitle">Nova Demanda</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="demandForm" class="space-y-4">
                    <input type="hidden" id="cardId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Título da Demanda *</label>
                        <input type="text" id="titulo" class="notion-input" required placeholder="Ex: Ajuste de fatura...">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cliente *</label>
                            <input type="text" id="cliente" class="notion-input" required placeholder="Nome do cliente">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Produto/Serviço *</label>
                            <select id="produto" class="notion-input" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Produto A">Produto A</option>
                                <option value="Produto B">Produto B</option>
                                <option value="Serviço C">Serviço C</option>
                                <option value="Serviço D">Serviço D</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Operador *</label>
                            <select id="operador" class="notion-input" required>
                                <option value="" disabled selected>Responsável</option>
                                <option value="Operador 1">Operador 1</option>
                                <option value="Operador 2">Operador 2</option>
                                <option value="Operador 3">Operador 3</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ação Necessária *</label>
                            <select id="acao" class="notion-input" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="E-mail">E-mail</option>
                                <option value="Retorno Telefônico">Retorno Telefônico</option>
                                <option value="Análise Interna">Análise Interna</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data de Retorno *</label>
                        <input type="date" id="dataRetorno" class="notion-input" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Observações</label>
                        <textarea id="observacoes" class="notion-input resize-none h-24" placeholder="Detalhes adicionais..."></textarea>
                    </div>
                </form>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-lg">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-200 rounded-md transition-colors">Cancelar</button>
                <button type="button" onclick="saveDemand()" class="notion-btn-primary">Salvar Demanda</button>
            </div>
        </div>
    </div>

    <!-- Firebase e Lógica da Aplicação -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Ambiente e Configuração
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'backoffice-notion-kanban';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Mock config for local testing if needed, though system requires actual env vars in production
            apiKey: "mock-key",
            projectId: "mock-project",
        };
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        let demandsData = [];

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                updateSyncStatus('Sincronizado', 'bg-green-500', false);
                setupRealtimeListener();

            } catch (error) {
                console.error("Erro ao inicializar Firebase:", error);
                updateSyncStatus('Erro de Conexão', 'bg-red-500', false);
            }
        }

        // Função utilitária para o caminho estrito exigido (RULE 1)
        function getCollectionRef() {
            // Usando public/data para que os 3 operadores vejam a mesma prancheta
            return collection(db, 'artifacts', appId, 'public', 'data', 'demands');
        }
        
        function getDocRef(id) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'demands', id);
        }

        function setupRealtimeListener() {
            const q = query(getCollectionRef());
            // RULE 2: No complex queries. Fetch all, sort in memory.
            
            onSnapshot(q, (snapshot) => {
                demandsData = [];
                snapshot.forEach((doc) => {
                    demandsData.push({ id: doc.id, ...doc.data() });
                });
                
                // Ordenar por data de criação localmente
                demandsData.sort((a, b) => b.createdAt - a.createdAt);
                
                renderBoard();
            }, (error) => {
                console.error("Erro no listener de dados:", error);
                updateSyncStatus('Erro de Sincronização', 'bg-red-500', false);
            });
        }

        // Atualização da UI
        function updateSyncStatus(text, colorClass, pulse) {
            const statusEl = document.getElementById('sync-status');
            const pulseClass = pulse ? 'animate-pulse' : '';
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full ${colorClass} inline-block ${pulseClass}"></span> ${text}`;
        }

        function getStatusColor(status) {
            switch(status) {
                case 'ativas': return 'bg-gray-100 text-gray-700 border-gray-200';
                case 'processo': return 'bg-blue-50 text-blue-700 border-blue-200';
                case 'finalizadas': return 'bg-green-50 text-green-700 border-green-200';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function getOperatorColor(operator) {
            switch(operator) {
                case 'Operador 1': return 'bg-purple-100 text-purple-700';
                case 'Operador 2': return 'bg-pink-100 text-pink-700';
                case 'Operador 3': return 'bg-indigo-100 text-indigo-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function isDatePastDue(dateString, status) {
            if (status === 'finalizadas') return false; // Don't highlight completed tasks
            const returnDate = new Date(dateString);
            const today = new Date();
            today.setHours(0,0,0,0);
            returnDate.setHours(0,0,0,0);
            return returnDate < today;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        function renderBoard() {
            const cols = {
                'ativas': document.getElementById('col-ativas'),
                'processo': document.getElementById('col-processo'),
                'finalizadas': document.getElementById('col-finalizadas')
            };

            // Limpar colunas
            Object.values(cols).forEach(col => col.innerHTML = '');

            let counts = { ativas: 0, processo: 0, finalizadas: 0 };

            demandsData.forEach(demand => {
                const col = cols[demand.status] || cols['ativas'];
                counts[demand.status]++;
                
                const isPastDue = isDatePastDue(demand.dataRetorno, demand.status);
                const dateBadgeClass = isPastDue 
                    ? 'bg-red-100 text-red-700 border-red-200' 
                    : 'bg-gray-100 text-gray-600 border-gray-200';

                const cardHTML = `
                    <div id="${demand.id}" class="kanban-card bg-white border border-gray-200 rounded-lg p-3 cursor-grab relative group" draggable="true" ondragstart="dragStart(event)">
                        
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${getStatusColor(demand.status)}">
                                ${demand.produto}
                            </span>
                            <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
                                <button onclick="editDemand('${demand.id}')" class="text-gray-400 hover:text-blue-500" title="Editar">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </button>
                                <button onclick="confirmDelete('${demand.id}')" class="text-gray-400 hover:text-red-500" title="Excluir">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </div>
                        
                        <h3 class="font-medium text-sm text-gray-800 leading-tight mb-1">${demand.titulo}</h3>
                        <p class="text-xs text-gray-500 mb-3 truncate" title="${demand.cliente}">👤 ${demand.cliente}</p>
                        
                        <div class="flex flex-wrap gap-1.5 mb-3">
                            <span class="text-[11px] px-2 py-0.5 rounded-full ${getOperatorColor(demand.operador)}">
                                ${demand.operador}
                            </span>
                            <span class="text-[11px] px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">
                                ${demand.acao}
                            </span>
                        </div>

                        ${demand.observacoes ? `<p class="text-[11px] text-gray-400 mb-3 line-clamp-2 bg-gray-50 p-1.5 rounded">${demand.observacoes}</p>` : ''}

                        <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-50">
                            <span class="text-[11px] flex items-center gap-1 font-medium border px-1.5 py-0.5 rounded ${dateBadgeClass}">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                ${formatDate(demand.dataRetorno)}
                            </span>
                            
                            <!-- Mobile fallback para mover card sem drag-and-drop -->
                            <select onchange="updateStatus(this, '${demand.id}')" class="text-[10px] bg-transparent border-none text-gray-400 hover:text-gray-700 focus:outline-none cursor-pointer p-0 md:hidden block">
                                <option value="ativas" ${demand.status === 'ativas' ? 'selected' : ''}>Ativa</option>
                                <option value="processo" ${demand.status === 'processo' ? 'selected' : ''}>Processo</option>
                                <option value="finalizadas" ${demand.status === 'finalizadas' ? 'selected' : ''}>Fim</option>
                            </select>
                        </div>
                    </div>
                `;
                col.innerHTML += cardHTML;
            });

            // Atualizar contadores
            document.getElementById('count-ativas').innerText = counts.ativas;
            document.getElementById('count-processo').innerText = counts.processo;
            document.getElementById('count-finalizadas').innerText = counts.finalizadas;
        }

        // --- Drag and Drop Logic ---
        window.dragStart = function(event) {
            event.dataTransfer.setData("text/plain", event.target.id);
            setTimeout(() => {
                event.target.classList.add('dragging');
            }, 0);
        }

        window.allowDrop = function(event) {
            event.preventDefault();
        }

        window.drop = async function(event, status) {
            event.preventDefault();
            const id = event.dataTransfer.getData("text/plain");
            const element = document.getElementById(id);
            if(element) element.classList.remove('dragging');
            
            if (id && status) {
                // Previne chamada redundante se não mudou de coluna
                const demand = demandsData.find(d => d.id === id);
                if (demand && demand.status !== status) {
                     await saveStatusUpdate(id, status);
                }
            }
        }

        document.addEventListener('dragend', (e) => {
            if(e.target.classList) {
                e.target.classList.remove('dragging');
            }
        });
        // -----------------------------

        window.updateStatus = async function(selectElement, id) {
            const newStatus = selectElement.value;
            await saveStatusUpdate(id, newStatus);
        }

        async function saveStatusUpdate(id, newStatus) {
            if (!auth.currentUser) return;
            try {
                updateSyncStatus('Salvando...', 'bg-yellow-400', true);
                const ref = getDocRef(id);
                await updateDoc(ref, { status: newStatus });
                updateSyncStatus('Sincronizado', 'bg-green-500', false);
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                updateSyncStatus('Erro ao salvar', 'bg-red-500', false);
            }
        }

        // --- Funções do Modal e Formulário ---
        window.openModal = function(isEdit = false) {
            document.getElementById('demandModal').classList.remove('hidden');
            if (!isEdit) {
                document.getElementById('demandForm').reset();
                document.getElementById('cardId').value = '';
                document.getElementById('modalTitle').innerText = 'Nova Demanda';
            }
        }

        window.closeModal = function() {
            document.getElementById('demandModal').classList.add('hidden');
        }

        window.editDemand = function(id) {
            const demand = demandsData.find(d => d.id === id);
            if (!demand) return;

            document.getElementById('cardId').value = demand.id;
            document.getElementById('titulo').value = demand.titulo;
            document.getElementById('cliente').value = demand.cliente;
            document.getElementById('produto').value = demand.produto;
            document.getElementById('operador').value = demand.operador;
            document.getElementById('acao').value = demand.acao;
            document.getElementById('dataRetorno').value = demand.dataRetorno;
            document.getElementById('observacoes').value = demand.observacoes || '';
            
            document.getElementById('modalTitle').innerText = 'Editar Demanda';
            openModal(true);
        }

        window.saveDemand = async function() {
            if (!auth.currentUser) return;
            
            const form = document.getElementById('demandForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const id = document.getElementById('cardId').value;
            const demandData = {
                titulo: document.getElementById('titulo').value,
                cliente: document.getElementById('cliente').value,
                produto: document.getElementById('produto').value,
                operador: document.getElementById('operador').value,
                acao: document.getElementById('acao').value,
                dataRetorno: document.getElementById('dataRetorno').value,
                observacoes: document.getElementById('observacoes').value,
                updatedAt: Date.now()
            };

            try {
                updateSyncStatus('Salvando...', 'bg-yellow-400', true);
                if (id) {
                    // Editar existente
                    await updateDoc(getDocRef(id), demandData);
                } else {
                    // Criar nova (default status: ativas)
                    demandData.status = 'ativas';
                    demandData.createdAt = Date.now();
                    await addDoc(getCollectionRef(), demandData);
                }
                closeModal();
                updateSyncStatus('Sincronizado', 'bg-green-500', false);
            } catch (error) {
                console.error("Erro ao salvar demanda:", error);
                updateSyncStatus('Erro ao salvar', 'bg-red-500', false);
            }
        }

        // Custom Confirm UI para substituir window.confirm (Regra do sistema)
        window.confirmDelete = function(id) {
            // Em uma app real, criaríamos um modal customizado de confirmação
            // Para manter em um arquivo simplificado, faremos a deleção com um 'soft' confirm simulado via UI
            const card = document.getElementById(id);
            const originalHTML = card.innerHTML;
            
            card.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full min-h-[100px] text-center p-2">
                    <p class="text-sm text-gray-700 mb-3 font-medium">Excluir demanda?</p>
                    <div class="flex gap-2">
                        <button onclick="executeDelete('${id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs">Sim, excluir</button>
                        <button onclick="cancelDelete('${id}')" class="bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs">Cancelar</button>
                    </div>
                </div>
            `;
            
            // Salvar html original caso cancele (apenas localmente até renderizar novamente)
            card.dataset.originalHtml = originalHTML;
        }

        window.cancelDelete = function(id) {
            renderBoard(); // Simplesmente re-renderiza para limpar o estado de confirmação
        }

        window.executeDelete = async function(id) {
            if (!auth.currentUser) return;
            try {
                updateSyncStatus('Excluindo...', 'bg-yellow-400', true);
                await deleteDoc(getDocRef(id));
                updateSyncStatus('Sincronizado', 'bg-green-500', false);
            } catch (error) {
                console.error("Erro ao excluir:", error);
                updateSyncStatus('Erro ao excluir', 'bg-red-500', false);
            }
        }

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', initFirebase);

    </script>
</body>
</html>
